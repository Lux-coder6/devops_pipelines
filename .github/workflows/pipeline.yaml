name: CI Pipeline
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Up Node.js
        uses: actions/checkout@v4
        with:
          node-version: 24

      - name: Install dependecies
        run: npm install

      - name: Run test
        run: npm test